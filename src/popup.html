<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab-a-mole</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <h1>Tab-a-mole</h1>
      <div class="controls">
        <label for="matchLevelSlider">Match by:</label>
        <div class="slider-container">
          <input
            type="range"
            min="1"
            max="5"
            value="5"
            class="slider"
            id="matchLevelSlider"
          />
        </div>
        <div>Example:</div>
        <div class="example-url">
          <span class="url-part matched" data-part="subdomains">www.</span
          ><span class="url-part matched" data-part="domain">example.com</span
          ><span class="url-part matched" data-part="path">/news/earth</span
          ><span class="url-part matched" data-part="query">?q=2025</span
          ><span class="url-part matched" data-part="hash">#water</span>
        </div>
      </div>
    </div>
    <div class="options">
      <input type="checkbox" id="currentWindowOnly" name="currentWindowOnly" />
      <label for="currentWindowOnly">Find in current window only</label>
    </div>
    <div class="options">
      <input type="checkbox" id="httpsOnly" name="httpsOnly" />
      <label for="httpsOnly">Match HTTPS URLs only</label>
    </div>
    <button id="findDuplicates">Find Duplicates</button>
    <div id="duplicateList"></div>
    <script src="popup.js"></script>
  </body>
</html>
