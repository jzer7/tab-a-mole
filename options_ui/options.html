<!doctype html>
<html>
  <head>
    <title>Tab-a-mole Options</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="../scripts/theme.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Extension options</h1>
    </header>
    <main>
      <section aria-labelledby="display-options">
        <h2 id="display-options">Display Options</h2>
        <fieldset>
          <legend>Color theme</legend>
          <label><input type="radio" name="theme" value="light" /> Light</label>
          <label><input type="radio" name="theme" value="system" /> System</label>
          <label><input type="radio" name="theme" value="dark" /> Dark</label>
        </fieldset>
        <fieldset>
          <legend>Font size</legend>
          <label><input type="radio" name="font-size" value="s" /> Small</label>
          <label><input type="radio" name="font-size" value="m" /> Medium</label>
          <label><input type="radio" name="font-size" value="l" /> Large</label>
        </fieldset>
      </section>
      <section aria-labelledby="information-options">
        <h2 id="information-options">Information Options</h2>
        <fieldset>
          <legend>Additional details</legend>
          <div class="section-item">
            <label>
              <input type="checkbox" name="show-pinned-icon" />
              Show pinned icon
            </label>
            <details class="help-text">Show a pinned icon next to results that are pinned tabs</details>
          </div>
          <div class="section-item">
            <label>
              <input type="checkbox" name="show-elapsed-time" />
              Show elapsed time
            </label>
            <details class="help-text">Show the time elapsed since the tab was last accessed</details>
          </div>
        </fieldset>
      </section>
    </main>
    <script type="module" src="options.js" defer></script>
  </body>
</html>
