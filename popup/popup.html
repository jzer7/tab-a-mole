<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab-a-mole</title>
    <!-- script
      src="https://kit.fontawesome.com/482152a765.js"
      crossorigin="anonymous"
    script -->
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="../scripts/theme.ts" defer></script>
  </head>
  <body>
    <header class="popup-header">
      <h1>Tab-a-mole</h1>
      <button
        id="themeToggle"
        type="button"
        class="theme-toggle"
        title="Switch to dark theme"
        aria-label="Switch to dark theme"
      >
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
    </header>
    <main>
      <fieldset class="controls" aria-labelledby="controls-legend">
        <legend id="controls-legend">Configure search</legend>
        <div class="controls__group">
          <span class="controls__label">Match by:</span>
          <label><input type="radio" name="match-by" value="url" checked /> URL</label>
          <label><input type="radio" name="match-by" value="title" /> Title</label>
        </div>
        <div class="controls__group">
          <label for="matchLevelSlider">Adjust scope of URLs:</label>
          <input
            type="range"
            min="1"
            max="5"
            value="5"
            class="slider__slide"
            id="matchLevelSlider"
          />
        </div>
        <div class="controls__group" id="exampleUrl">
          <span class="controls__label">Example:</span>
          <span class="text-pattern__text" id="sampleUrl">
            <span class="enabled" data-part="subdomains">www.</span>
            <span class="enabled" data-part="domain">example.com</span>
            <span class="enabled" data-part="path">/news/earth</span>
            <span class="enabled" data-part="query">?q=2025</span>
            <span class="enabled" data-part="hash">#water</span>
          </span>
        </div>
        <div class="controls__group">
          <input type="checkbox" id="currentWindowOnly" name="currentWindowOnly" />
          <label for="currentWindowOnly">Search in current window only</label>
        </div>
        <div class="controls__group">
          <input type="checkbox" id="httpsOnly" name="httpsOnly" checked />
          <label for="httpsOnly"
            >Only consider tabs with external HTTPS URLs (e.g.,
            <code>chrome://</code>)</label
          >
        </div>
        <div class="controls__group controls__actions">
          <button id="findDuplicates" type="button" aria-label="Find Duplicates">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          </button>
          <button
            id="openSidebarPreview"
            type="button"
            class="button-secondary"
            title="Open Tab-a-mole in the sidebar"
          >
            Open Sidebar
          </button>
        </div>
      </fieldset>

      <section
        id="results"
        class="results results-panel"
        aria-labelledby="results-legend"
      >
        <h2 id="results-legend" class="results__heading">Results</h2>

        <div class="results__msg" id="startSearch" hidden aria-live="polite">
          Configure search options, and start a search
        </div>
        <div class="results__msg" id="loadingMessage" hidden aria-live="polite">
          Loading...
        </div>
        <div class="results__msg" id="errorMessage" hidden aria-live="polite"></div>
        <div class="results__msg" id="noDuplicatesMessage" hidden aria-live="polite">
          No duplicate tabs found. 😎
        </div>
        <div class="results__msg" id="duplicateList" aria-live="polite">
          <!-- Dedicated aria-live region for dynamic result updates -->
          <div
            id="resultsLiveRegion"
            class="sr-only"
            aria-live="polite"
            role="status"
          ></div>
        </div>
      </section>
    </main>

    <!-- Templates for dynamic rendering -->
    <template id="tab-group-template">
      <section class="tab-group" role="region" aria-label="Duplicate Tab Group">
        <header class="tab-group__header">
          <span class="tab-group__key"></span>
          <span class="tab-group__count"></span>
        </header>
        <ul class="tab-list" role="list"></ul>
        <div class="tab-group__actions">
          <button
            class="tab-group__goto-first"
            type="button"
            aria-label="Go to first tab in this group"
          >
            <span class="sr-only">Go to first tab in this group</span>
            <i class="fa-solid fa-arrow-turn-up" aria-hidden="true"></i>
          </button>
          <button
            class="tab-group__close-all dangerous"
            type="button"
            aria-label="Close all tabs in this group"
          >
            <span class="sr-only">Close all tabs in this group</span>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </section>
    </template>

    <template id="tab-item-template">
      <li class="tab-list__item" role="listitem">
        <span class="tab-title"></span>
        <span class="tab-group-chip" hidden></span>
        <span class="tab-elapsed"></span>
        <span class="tab-symbol"></span>

        <button class="tab-goto" type="button">
          <span class="sr-only">Go to this tab</span>
          <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </button>

        <button class="tab-close dangerous" type="button">
          <span class="sr-only">Close this tab</span>
          <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i>
        </button>
      </li>
    </template>

    <script type="module" src="popup.ts" defer></script>
  </body>
</html>
