<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab-a-mole</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="theme.js"></script>
  </head>
  <body style="min-width: 400px; max-width: 600px">
    <!-- Container for title -->
    <header>
      <h1>Tab-a-mole</h1>
    </header>
    <main>
      <!-- Controls Section -->
      <section class="controls" aria-labelledby="controls-legend">
        <fieldset>
          <legend id="controls-legend">Configure search</legend>

          <!-- Search modality -->
          <fieldset>
            <legend>Match by</legend>
            <label><input type="radio" name="match-by" value="url" checked /> URL</label>
            <label><input type="radio" name="match-by" value="title" /> Title</label>
          </fieldset>

          <!-- Search by URL -->
          <fieldset id="urlScope">
            <legend>Configure URL scope</legend>
            <!-- Slider control -->
            <div class="slider">
              <label for="matchLevelSlider">Adjust scope of URLs:</label>
              <input type="range" min="1" max="5" value="5" class="slider__slide" id="matchLevelSlider" />
            </div>

            <!-- Text pattern indicator -->
            <div class="text-pattern">
              <div class="text-pattern__label">Example:</div>
              <div class="text-pattern__text" id="sampleUrl">
                <span class="enabled" data-part="subdomains">www.</span
                ><span class="enabled" data-part="domain">example.com</span
                ><span class="enabled" data-part="path">/news/earth</span
                ><span class="enabled" data-part="query">?q=2025</span
                ><span class="enabled" data-part="hash">#water</span>
              </div>
            </div>
          </fieldset>

          <!-- Control options -->
          <div class="controls__options">
            <input type="checkbox" id="currentWindowOnly" name="currentWindowOnly" />
            <label for="currentWindowOnly">Find in current window only</label>
          </div>
          <div class="controls__options">
            <input type="checkbox" id="httpsOnly" name="httpsOnly" />
            <label for="httpsOnly">Only match tabs with HTTPS URLs (e.g., <em>chrome://</em> )</label>
          </div>
        </fieldset>
        <div class="controls__options">
          <button id="findDuplicates" type="button">Find Duplicates</button>
        </div>
      </section>

      <!-- Results Section -->
      <section class="results" aria-labelledby="results-legend">
        <fieldset>
          <legend id="results-legend">Results</legend>
          <div class="results__msg" id="startSearch" aria-live="polite">
            Configure search options, and start a search
          </div>
          <div class="results__msg" id="loadingMessage" hidden aria-live="polite">Loading...</div>
          <div class="results__msg" id="noDuplicatesMessage" hidden aria-live="polite">No duplicate tabs found. 😎</div>
          <div class="results__msg" id="duplicateList" hidden aria-live="polite"></div>
        </fieldset>
      </section>
    </main>
    <template id="matched-group-template">
      <section class="matched-group" role="region" aria-label="Duplicate Tab Group">
        <header class="matched-group__header">
          <span class="matched-group__key"></span>
          <span class="matched-group__count"></span>
        </header>
        <div class="matched-group__items">
          <ul class="matched-group__list" role="list"></ul>
        </div>
        <div class="matched-group__actions">
          <button class="matched-group__close-all" type="button" aria-label="Close all tabs in this group">
            Close All
          </button>
          <button class="matched-group__goto-first" type="button" aria-label="Go to first tab in this group">
            Go to First
          </button>
        </div>
      </section>
    </template>
    <template id="tab-item-template">
      <li role="listitem">
        <div class="tab-item">
          <div>
            <span class="tab-item__title"></span>
            <span class="tab-item__elapsed"></span>
            <span class="tab-item__symbol"></span>
          </div>
          <div class="tab-item__goto">
            <button type="button" aria-label="Go to this tab">Go</button>
          </div>
          <div class="tab-item__close">
            <button type="button" aria-label="Close this tab">Close</button>
          </div>
        </div>
      </li>
    </template>
    <!-- Script: ensure it loads at the end -->
    <script src="popup.js"></script>
  </body>
</html>
